<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rgbil - CMS Admin</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f4f5; color: #18181b; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; font-size: 24px; display: flex; justify-content: space-between; align-items: center; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #e4e4e7; }
        .section h2 { font-size: 18px; margin-bottom: 15px; }
        label { display: block; font-weight: 500; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], textarea { width: 100%; padding: 8px 12px; border: 1px solid #d4d4d8; border-radius: 4px; box-sizing: border-box; font-family: inherit; margin-bottom: 15px; }
        textarea { height: 120px; resize: vertical; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-weight: normal; font-size: 16px; cursor: pointer; }
        .checkbox-label input { width: 18px; height: 18px; cursor: pointer; }
        .project-card { border: 1px solid #e4e4e7; padding: 15px; border-radius: 6px; margin-bottom: 15px; background: #fafafa; display: flex; gap: 15px; align-items: flex-start; }
        .project-card .fields { flex: 1; }
        .project-card input { margin-bottom: 10px; }
        .btn { padding: 8px 16px; background: #18181b; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; }
        .btn:hover { background: #27272a; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-primary { background: #dd3966; font-size: 16px; padding: 10px 20px; }
        .btn-primary:hover { background: #c62f59; }
        .btn-small { padding: 4px 10px; font-size: 12px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; gap: 10px; }
        .status { padding: 10px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }
        .status.success { background: #dcfce7; color: #166534; }
        .status.error { background: #fee2e2; color: #991b1b; }
        .controls { display: flex; flex-direction: column; gap: 5px; }
        [v-cloak] { display: none; }
    </style>
</head>
<body>
    <div id="app" class="container" v-cloak>
        <h1>
            rgbil CMS
            <div class="header-actions">
                <button class="btn" @click="saveData" :disabled="saving">{{ saving ? 'Saving...' : 'Save Draft' }}</button>
                <button class="btn btn-primary" @click="buildSite" :disabled="building">{{ building ? 'Building...' : 'Export to Static' }}</button>
            </div>
        </h1>

        <div v-if="message" class="status" :class="messageType">
            {{ message }}
        </div>

        <div v-if="data" class="content">
            <div class="section">
                <h2>Global Settings</h2>
                <label class="checkbox-label">
                    <input type="checkbox" v-model="data.showBehance">
                    Show Behance Links (Toggle this off while Behance profile is not ready)
                </label>
            </div>

            <div class="section">
                <h2>About Text & Contact</h2>
                <label>About Me Text</label>
                <textarea v-model="data.aboutText"></textarea>

                <label>Email Address</label>
                <input type="text" v-model="data.email">

                <label>Instagram URL</label>
                <input type="text" v-model="data.socialLinks.instagram">

                <label>LinkedIn URL</label>
                <input type="text" v-model="data.socialLinks.linkedin">
                
                <label>Behance URL</label>
                <input type="text" v-model="data.socialLinks.behance">
            </div>

            <div class="section">
                <div class="flex-between" style="margin-bottom:15px;">
                    <h2>Highlighted Categories (Top 3)</h2>
                </div>
                <div v-for="(cat, index) in data.categories" :key="'cat'+index" class="project-card">
                    <div class="fields">
                        <label>Title</label>
                        <input type="text" v-model="cat.title">
                        <label>Image Path (e.g. img/cat-branding.png)</label>
                        <input type="text" v-model="cat.img">
                        <label>Behance Link (if visible)</label>
                        <input type="text" v-model="cat.href">
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="flex-between" style="margin-bottom:15px;">
                    <h2>Portfolio Projects (Grid)</h2>
                    <button class="btn btn-small" @click="addProject">+ Add Project</button>
                </div>
                
                <div v-for="(project, index) in data.projects" :key="project.id" class="project-card">
                    <div class="controls">
                        <button class="btn btn-small" @click="moveProject(index, -1)" :disabled="index === 0">↑</button>
                        <button class="btn btn-small" @click="moveProject(index, 1)" :disabled="index === data.projects.length - 1">↓</button>
                    </div>
                    <div class="fields">
                        <label>Project Title</label>
                        <input type="text" v-model="project.title">
                        
                        <label>Category</label>
                        <input type="text" v-model="project.category">
                        
                        <label>Image Path (e.g. img/work-1.png)</label>
                        <input type="text" v-model="project.img">
                        
                        <label>Project Link (Behance URL)</label>
                        <input type="text" v-model="project.href">
                    </div>
                    <button class="btn btn-danger btn-small" @click="removeProject(index)">Remove</button>
                </div>
            </div>
        </div>
        <div v-else>Loading data...</div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const data = ref(null);
                const saving = ref(false);
                const building = ref(false);
                const message = ref('');
                const messageType = ref('');

                const loadData = async () => {
                    const res = await fetch('/api/data');
                    data.value = await res.json();
                };

                const showMessage = (msg, type = 'success') => {
                    message.value = msg;
                    messageType.value = type;
                    setTimeout(() => message.value = '', 4000);
                };

                const saveData = async () => {
                    saving.value = true;
                    try {
                        const res = await fetch('/api/data', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data.value)
                        });
                        if (res.ok) showMessage('Draft saved successfully!');
                        else throw new Error('Failed to save');
                    } catch (e) {
                        showMessage(e.message, 'error');
                    }
                    saving.value = false;
                };

                const buildSite = async () => {
                    building.value = true;
                    await saveData(); // Save first before building
                    try {
                        const res = await fetch('/api/build', { method: 'POST' });
                        if (res.ok) showMessage('Site exported to static HTML successfully! Ready for GitHub.', 'success');
                        else throw new Error('Build failed');
                    } catch (e) {
                        showMessage(e.message, 'error');
                    }
                    building.value = false;
                };

                const addProject = () => {
                    const newId = data.value.projects.length > 0 ? Math.max(...data.value.projects.map(p => p.id || 0)) + 1 : 1;
                    data.value.projects.push({
                        id: newId,
                        title: 'New Project',
                        category: 'Category',
                        img: 'img/placeholder.png',
                        href: 'https://www.behance.net/rgbil'
                    });
                };

                const removeProject = (index) => {
                    if (confirm('Are you sure you want to remove this project?')) {
                        data.value.projects.splice(index, 1);
                    }
                };

                const moveProject = (index, dir) => {
                    const newIndex = index + dir;
                    if (newIndex < 0 || newIndex >= data.value.projects.length) return;
                    const arr = data.value.projects;
                    const temp = arr[index];
                    arr[index] = arr[newIndex];
                    arr[newIndex] = temp;
                };

                onMounted(loadData);

                return { data, saving, building, message, messageType, saveData, buildSite, addProject, removeProject, moveProject };
            }
        }).mount('#app');
    </script>
</body>
</html>
